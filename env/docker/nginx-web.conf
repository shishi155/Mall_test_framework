# mall-admin-web 静态站点 + 同源反向代理
# 目的: 前端打包时把 API 基址置为 "/"，由 nginx 转发到 mall-admin，
#       这样浏览器/容器内访问都不依赖 localhost:18080，也规避 CORS。
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    charset utf-8;

    access_log  /var/log/nginx/mall-web.access.log;
    error_log   /var/log/nginx/mall-web.error.log warn;

    # 兼容 hash 路由：静态资源优先，回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台管理接口：前端统一以 /api 为前缀，nginx 去掉前缀后转发
    # 例：/api/product/list -> mall-admin:8080/product/list
    location /api/ {
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://mall-admin:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # 兼容未加 /api 前缀的旧路径（登录等）
    location /admin/ {
        proxy_pass         http://mall-admin:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 120s;
    }

    # 文件上传（MinIO / OSS 签名）
    location ~ ^/(minio|aliyun)/ {
        proxy_pass         http://mall-admin:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 300s;
    }

    # 监控与接口文档（仅测试环境开放）
    location ~ ^/(actuator|v3/api-docs|swagger-ui) {
        proxy_pass         http://mall-admin:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}
