[pytest]
testpaths = tests
pythonpath = .
addopts = -v -ra --strict-markers --alluredir=reports/allure-results --clean-alluredir
log_cli = false
log_level = INFO
filterwarnings =
    ignore::DeprecationWarning
markers =
    smoke: 冒烟用例，每次提交必跑
    regression: 回归用例
    security: 安全专项用例
    perf: 性能相关
    point: 单接口校验点用例（可由 Excel 驱动）
    link: 业务链路用例
    case_id: 关联 Excel 用例编号
